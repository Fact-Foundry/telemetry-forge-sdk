name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/FactFoundry.TelemetryForge.Core/FactFoundry.TelemetryForge.Core.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o ./nupkgs
          dotnet pack src/FactFoundry.TelemetryForge.Web/FactFoundry.TelemetryForge.Web.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o ./nupkgs
          dotnet pack src/FactFoundry.TelemetryForge.Desktop/FactFoundry.TelemetryForge.Desktop.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o ./nupkgs

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
